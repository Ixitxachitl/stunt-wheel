<!doctype html>
<!--
  Tiny Wheel Stunt Track — OBS browser source
  ------------------------------------------------
  A tiny pixel-art wheel races an endless stunt track along the bottom of the source: ramps, loops and boost
  pads, roller-coaster lifts and dips, arches, glass pipes and mini-golf style set pieces to go through
  (giant movie monsters, a clown head, a windmill, cities' landmarks), pinball bumpers, flippers and drop
  targets, slot machines, roulette loops, and dice and chip stacks to spring over, in front of an old-time
  circus and a Vegas skyline. When people chat, their own wheels roll by in their chat color, with little
  pixel speech bubbles (and sometimes crash into a die and blow up).

  OBS: Add > Browser, URL https://race.ixitxachitl.com/, at your canvas size (e.g. 1920x1080). The track
       sits along the bottom edge, and the background is transparent inside OBS automatically.

  SETTINGS: in OBS, right-click this source → Interact, move the mouse over the overlay and click the
  gear in the bottom-right corner. Every setting can also be a URL parameter, which overrides it.

  Chat (all read anonymously, all optional; the track runs without it):
    channel   Twitch channel          kick      Kick channel
    tiktok    TikTok bridge: 1 = TikFinity on this PC, or a ws:// address
    youtube   a live video ID or link (needs ytkey), or a ws:// bridge
    ytkey     YouTube Data API v3 key ytpoll    seconds between YouTube checks (default 6)
    ignore    extra bot names to ignore, comma separated
    cmds      1 = show !commands too
    demo      1 = fake chat for trying it out

  Chat wheels:
    wheels    0 = no chat wheels at all
    max       most chat wheels on screen at once (default 5)
    gap       seconds between new wheels (default 2)
    bubbles   0 = wheels only, no speech bubbles
    names     0 = leave the names out of the bubbles
    textsize  bubble text size in px (default 15)
    hold      bubble time multiplier (default 1)
    maxchars  longest message shown (default 120)

  Track:
    scale     pixel size (default 4; bigger = chunkier pixels)
    rows      track height in art pixels (default 72): how tall loops, coasters, decks and jumps can get.
              The canvas fills the source either way (at least this tall), with the track along its bottom.
    speed     game speed multiplier (default 1)
    crashes   0 = chat wheels never crash into the dice and chip stacks
    decor     0 = no floating decorations behind the track
    scenery   0 = no circus and Vegas skyline in the background
    bg      testing: none = transparent in a normal browser too, or a color (default: dark outside OBS)

  The broadcaster's own messages come from the main wheel, which takes on their chat color.

  Custom integrations (Streamer.bot, etc.) can call window.race.say(name, text, { color, owner }) and .clear().
-->
<html>
<head>
<meta charset="utf-8">
<title>Tiny Wheel Stunt Track</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
  canvas{position:fixed;left:0;bottom:0;image-rendering:pixelated;image-rendering:crisp-edges}
  /* Pixel style shared by the bubbles and the settings window: square corners, and --vx draws a notched
     ink outline (four offset shadows leave the corners out). --p is one track pixel on screen. */
  :root{--ink:#1f1830;--p:4px;
    --vx:0 calc(-1 * var(--p)) 0 0 var(--ink),0 var(--p) 0 0 var(--ink),calc(-1 * var(--p)) 0 0 0 var(--ink),var(--p) 0 0 0 var(--ink);
    --lit:inset 0 4px 0 0 rgba(255,255,255,.55),inset 0 -5px 0 0 rgba(0,0,0,.2);
    --pix:'Press Start 2P',monospace;--txt:'Pixelify Sans',system-ui,sans-serif;--ts:15px}
  /* Pixelify Sans's "fi" ligature looks like an "A" (set on everything, since the font shorthand resets it) */
  *{font-variant-ligatures:none}

  /* ---------- speech bubbles, moved over their wheel every frame ---------- */
  /* bubbles grow out of the spot where their tail leaves them (--ox, set as they move) */
  @keyframes grow{from{scale:0}to{scale:1}}
  .bub{position:fixed;left:0;top:0;width:max-content;max-width:calc(var(--ts) * 17);box-sizing:border-box;
    padding:calc(var(--p) + 3px) calc(var(--p) + 5px);background:#fffaf0;color:var(--ink);
    font:500 var(--ts)/1.3 var(--txt);overflow-wrap:anywhere;box-shadow:var(--vx);
    pointer-events:none;will-change:translate,scale;opacity:0;transition:opacity .25s;transform-origin:var(--ox,16px) 100%}
  .bub.show{opacity:1;animation:grow .3s cubic-bezier(.25,1.25,.5,1)}
  .bub b{display:block;width:max-content;max-width:100%;margin:0 0 5px;padding:4px 5px 3px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font:400 calc(var(--ts) * .58)/1.2 var(--pix);
    background:var(--c);color:var(--ink);box-shadow:inset 0 -2px 0 0 rgba(0,0,0,.25)}
  .bub .act{font-style:italic}
  .bub img{height:1.6em;vertical-align:middle;margin:-.1em .1em}
  /* the tail: shrinking squares spaced out along the line from the bubble to its wheel */
  .bub-dot{position:fixed;left:0;top:0;background:#fffaf0;box-shadow:var(--vx);pointer-events:none;
    will-change:translate,scale;opacity:0;transition:opacity .3s}
  .bub-dot.show{opacity:1;animation:grow .3s ease-out}

  /* ---------- settings window (only visible while you interact with the source) ---------- */
  /* Track colors: an orange girder header with the ramps' red-and-white stripes, and boost-pad blue. */
  #gear{position:fixed;right:20px;bottom:20px;width:48px;height:48px;z-index:1000;border:0;border-radius:0;
    background:#ff9a1f;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),var(--lit),6px 6px 0 2px rgba(20,10,40,.45);
    cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .1s}
  body.mouse #gear{opacity:1;pointer-events:auto}
  #gear:hover{transform:translateY(-2px)}
  #gear:active{transform:translateY(2px)}
  #gear svg{width:30px;height:30px}
  #settings{--p:4px;position:fixed;inset:0;z-index:1001;display:none;align-items:center;justify-content:center;
    background:rgba(16,10,32,.6) linear-gradient(rgba(255,255,255,.03) 2px,transparent 2px) 0 0/16px 16px;
    pointer-events:auto;font:500 15px/1.35 var(--txt);color:var(--ink)}
  #settings.open{display:flex}
  .sp{width:min(900px,92vw);max-height:90vh;display:flex;flex-direction:column;background:#ece4d0;
    box-shadow:var(--vx),12px 12px 0 2px rgba(20,10,40,.5)}
  .sp-head{position:relative;padding:30px 22px 14px;color:#fff3dc;
    background:linear-gradient(90deg,rgba(0,0,0,.08) 2px,transparent 2px) 0 0/16px 16px,#ff9a1f;
    box-shadow:inset 0 -4px 0 0 #c4500f,inset 0 -8px 0 0 #7a2c0a}
  .sp-head::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:#fff3a8}
  .sp-head::after{content:"";position:absolute;left:0;right:0;top:8px;height:8px;
    background:repeating-linear-gradient(90deg,#ff3b3b 0 12px,#fff 12px 24px)}
  .sp-head h2{margin:0;font:20px/1.2 var(--pix);color:#fff;text-shadow:3px 3px 0 #7a2c0a;letter-spacing:1px}
  .sp-head p{margin:8px 0 0;font-size:14px;color:#3a1406}
  .sp-body{overflow:auto;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;
    background:linear-gradient(rgba(0,0,0,.035) 2px,transparent 2px) 0 0/16px 16px,
      linear-gradient(90deg,rgba(0,0,0,.035) 2px,transparent 2px) 0 0/16px 16px}
  .sp-sec{padding:12px 14px 14px;background:#fffaf0;box-shadow:var(--vx),var(--lit),6px 6px 0 0 rgba(31,24,48,.18)}
  .sp-sec h3{margin:0 0 12px;font:12px/1.3 var(--pix);color:#c4500f;text-shadow:2px 2px 0 #ffe2b8}
  .sp-f{margin:0 0 12px}
  .sp-f:last-child{margin-bottom:0}
  .sp-f label{display:block;margin-bottom:5px;font-weight:700}
  .sp-f input[type=text],.sp-f input[type=password],.sp-f input[type=number],.sp-f select{
    width:100%;box-sizing:border-box;font:500 15px var(--txt);padding:7px 9px;border:0;border-radius:0;
    background:#fff;color:var(--ink);box-shadow:var(--vx),inset 0 4px 0 0 rgba(0,0,0,.12)}
  .sp-f input:focus,.sp-f select:focus{outline:3px solid #3ff8ff;outline-offset:5px}
  .sp-f input:disabled,.sp-f select:disabled{background:#e4ddcc;color:#6a6278}
  .sp-f small{display:block;margin-top:6px;font-size:13px;color:#5d5570}
  .sp-f small.url{color:#c2185b}
  .sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sp-row label{margin:0}
  .sw{position:relative;width:48px;height:24px;flex:none;margin-right:4px}
  .sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
  .sw i{position:absolute;inset:0;background:#c9c0ae;box-shadow:var(--vx),inset 0 4px 0 0 rgba(0,0,0,.15)}
  .sw i::after{content:'';position:absolute;top:4px;left:4px;width:16px;height:16px;background:#fff;
    box-shadow:0 0 0 3px var(--ink),inset 0 -3px 0 0 rgba(0,0,0,.2);transition:transform .12s ease-out}
  .sw input:checked + i{background:#3ff8ff}
  .sw input:checked + i::after{transform:translateX(24px)}
  .sw input:disabled + i{opacity:.5}
  .sp-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:16px 22px;background:#d8cfb8;
    box-shadow:inset 0 4px 0 0 var(--ink)}
  .sp-foot .grow{flex:1}
  .sp-btn{font:11px/1 var(--pix);padding:11px 14px 12px;border:0;border-radius:0;background:#fffaf0;color:var(--ink);
    box-shadow:var(--vx),var(--lit),0 6px 0 2px rgba(31,24,48,.35);cursor:pointer;transition:transform .06s}
  .sp-btn:hover{transform:translateY(-2px)}
  .sp-btn:active{transform:translateY(3px);box-shadow:var(--vx),var(--lit)}
  .sp-btn.go{background:#ff9a1f;color:#fff;text-shadow:2px 2px 0 #7a2c0a}
  .sp-btn.warn{background:#ff9fbd}
  .sp-msg{font-size:14px;color:#c4500f;min-height:1em}
  .sp-link{width:100%;font:12px monospace;padding:6px;border:0;box-shadow:var(--vx);display:none;margin-top:6px}
  /* a short source (just the track strip): let the whole window scroll instead of squashing the fields */
  @media (max-height:560px){
    #settings{align-items:flex-start}
    .sp{display:block;max-height:none;height:100vh;overflow:auto}
    .sp-head{padding:24px 16px 12px}
    .sp-head p{display:none}
    .sp-body{padding:14px 16px;gap:16px;overflow:visible}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  // ---------------- settings (saved locally; URL parameters override) ----------------
  const Q = new URLSearchParams(location.search);
  const STORE_KEY = 'race.settings.v1';
  let saved = {}, storageOK = true;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { storageOK = false; }
  const FIELDS = [
    { sec: 'Chat (optional)' },
    { k: 'channel', label: 'Twitch channel', type: 'text', def: '', ph: 'yourchannel', help: 'Read anonymously, no login needed.' },
    { k: 'kick', label: 'Kick channel', type: 'text', def: '', ph: 'yourchannel', help: 'Read anonymously, no login needed.' },
    { k: 'tiktok', label: 'TikTok bridge', type: 'text', def: '', ph: '1 = TikFinity, or ws://…', help: 'TikTok needs a local bridge app. "1" uses TikFinity on this PC.' },
    { k: 'youtube', label: 'YouTube live', type: 'text', def: '', ph: 'video ID / link, or ws://…', help: 'A live video ID or link (needs the API key below), or a bridge address.' },
    { k: 'ytkey', label: 'YouTube API key', type: 'password', def: '', help: 'YouTube Data API v3 key from Google Cloud Console.' },
    { k: 'ytpoll', label: 'YouTube check every (s)', type: 'num', def: 6, min: 2, max: 60, step: 1, help: 'Lower = snappier, but uses the daily API quota faster.' },
    { k: 'ignore', label: 'Ignore these names', type: 'text', def: '', ph: 'mybot, otherbot', help: 'Common bots are ignored already.' },
    { k: 'cmds', label: 'Show !commands', type: 'bool', def: false },
    { k: 'demo', label: 'Demo chat', type: 'bool', def: false, help: 'Fake chatters, for trying it out.' },
    { sec: 'Chat wheels' },
    { k: 'wheels', label: 'Chatters roll by', type: 'bool', def: true, help: 'Each chatter gets a wheel in their chat color.' },
    { k: 'max', label: 'Most wheels at once', type: 'num', def: 5, min: 1, max: 20, step: 1, help: 'Busy chat waits its turn.' },
    { k: 'gap', label: 'Seconds between wheels', type: 'num', def: 2, min: 0, max: 60, step: 0.5, help: 'Raise it to make them come by now and then.' },
    { k: 'bubbles', label: 'Speech bubbles', type: 'bool', def: true },
    { k: 'names', label: 'Names in bubbles', type: 'bool', def: true },
    { k: 'textsize', label: 'Bubble text size (px)', type: 'num', def: 15, min: 8, max: 40, step: 1 },
    { k: 'hold', label: 'Bubble time ×', type: 'num', def: 1, min: 0.3, max: 5, step: 0.1, help: 'How long messages stay up.' },
    { k: 'maxchars', label: 'Max message length', type: 'num', def: 120, min: 20, max: 500, step: 5 },
    { sec: 'Track' },
    { k: 'scale', label: 'Pixel size', type: 'num', def: 4, min: 1, max: 12, step: 1, help: 'Bigger = chunkier pixels and a bigger wheel.' },
    { k: 'rows', label: 'Track height (rows)', type: 'num', def: 72, min: 40, max: 160, step: 1, help: 'How tall loops, coasters, decks and jumps can get, in art pixels. Under 72 leaves out the big tunnels.' },
    { k: 'speed', label: 'Speed ×', type: 'num', def: 1, min: 0.1, max: 5, step: 0.1 },
    { k: 'crashes', label: 'Chat wheels can crash', type: 'bool', def: true, help: 'Now and then one hits a die or a chip stack and blows up. Yours never does, and nobody crashes mid-message.' },
    { k: 'decor', label: 'Floating decorations', type: 'bool', def: true, help: 'Dice, chips, coins and card suits drifting behind the track.' },
    { k: 'scenery', label: 'Circus & Vegas scenery', type: 'bool', def: true, help: 'Little circus tents, booths, clowns and a circus train, with Vegas hotels behind.' },
  ];
  const FIELD = Object.fromEntries(FIELDS.filter(f => f.k).map(f => [f.k, f]));
  function coerce(f, v) {
    if (f.type === 'bool') return v === true || v === 1 || /^(1|true|yes|on)$/i.test(String(v));
    if (f.type === 'num') { const n = parseFloat(v); return isNaN(n) ? f.def : Math.min(f.max, Math.max(f.min, n)); }
    if (f.type === 'select') return f.opts.some(o => o[0] === v) ? v : f.def;
    return String(v ?? '').trim();
  }
  const fromURL = {};
  for (const f of Object.values(FIELD)) if (Q.has(f.k)) fromURL[f.k] = coerce(f, Q.get(f.k));
  const SET = {};
  for (const f of Object.values(FIELD)) SET[f.k] = f.k in fromURL ? fromURL[f.k] : f.k in saved ? coerce(f, saved[f.k]) : f.def;
  const CFG = {
    ...SET,
    channel: SET.channel.replace(/^#/, '').toLowerCase(),
    kick: SET.kick.replace(/^.*kick\.com\//i, '').replace(/[/?#].*$/, '').toLowerCase(),
    tiktok: SET.tiktok === '1' ? 'ws://localhost:21213/' : SET.tiktok,
  };

  const SCALE = CFG.scale, ROWS = CFG.rows, SPEED = CFG.speed;
  // Preview background outside OBS so you can actually see it in a browser
  const bgq = Q.get('bg');
  if (bgq && bgq !== 'none') document.body.style.background = bgq;
  else if (!bgq && !window.obsstudio) document.body.style.background = '#1d1b2a';

  const G = 320, CRUISE = 70, RW = 4;           // gravity, cruise speed, wheel radius (art px)
  const C = {
    top:'#fff3a8', body:'#ff9a1f', dark:'#c4500f', shade:'#7a2c0a',
    post:'rgba(90,70,110,0.6)', lattice:'rgba(90,70,110,0.35)',
    stripeA:'#ff3b3b', stripeB:'#ffffff',
    tire:'#282438',
    boostA:'#3ff8ff', boostB:'#1a5cff', pad:'#5dff6a', padDark:'#1f9e3a', coil:'#c8c8d8',
    shadow:'rgba(0,0,0,0.35)'
  };
  const MAIN_PAL = { main: '#9690be', rim: '#9690be', spoke: '#e9e6ff', hub: '#ff4d6d', trailA: C.boostA, trailB: C.boostB };

  // The canvas fills the whole source (at least `rows` tall) with the track along its bottom, so wheels
  // can fly up above the strip without being cut off.
  const cvs = document.getElementById('c');
  let ctx = cvs.getContext('2d');   // (bake() points it at an offscreen canvas for a moment)
  const rowsFor = () => Math.max(ROWS, Math.ceil(innerHeight / SCALE));
  const FLOOR = 14;   // the ground below the track (where the street lamps' light falls)
  let W = 0, H = rowsFor(), BASE = H - FLOOR, ready = false;
  function resize() {
    W = Math.ceil(innerWidth / SCALE);
    const nh = rowsFor();
    if (nh !== H) { const dy = nh - H; H = nh; BASE = H - FLOOR; if (ready) shiftDown(dy); }
    cvs.width = W; cvs.height = H;
    cvs.style.width = W * SCALE + 'px'; cvs.style.height = H * SCALE + 'px';
    ctx.imageSmoothingEnabled = false;
  }
  addEventListener('resize', resize); resize();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const ri  = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = a => a[(Math.random() * a.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = t => t * t * (3 - 2 * t);   // 0..1, easing in and out, so slopes start and end flat
  // a color made lighter (f > 0, toward white) or darker (f < 0, toward black)
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16), to = f > 0 ? 255 : 0, k = Math.abs(f);
    const ch = s => Math.round(((n >> s) & 255) + (to - ((n >> s) & 255)) * k);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }
  // Draws something once into a little offscreen canvas (px() and friends draw into it while fn runs), so
  // scenery that never changes costs one drawImage a frame.
  function bake(w, h, fn) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const main = ctx; ctx = c.getContext('2d');
    try { fn(); } finally { ctx = main; }
    return c;
  }

  // ---------------- wheels + particles ----------------
  // The streamer's wheel (wh) sets the camera; chatters' wheels (riders) share the same track and physics.
  const wheel = (x, cruise, pal) => ({ x, y: BASE - RW, v: cruise, vx: 0, vy: 0, mode: 'ground', rot: 0,
    boostT: 0, loop: null, th: 0, v0: 0, gvy: null, trail: [], cruise, pal });
  const wh = Object.assign(wheel(20, CRUISE, MAIN_PAL), { main: true });
  const riders = [];
  const parts = [];
  const rings = [];   // explosion shock rings
  const pops = [];    // floating pixel text: scores, BOOM, JACKPOT
  function popup(x, y, text, c) { if (!SIM) pops.push({ x, y, text, c, l: 1.2 }); }
  let simT = 0;       // seconds of game time, for the machines' timers
  function emit(x, y, n, cols, spdX, up, grav = 200, life = [0.3, 0.8], dir = 0) {
    if (SIM) return;
    for (let i = 0; i < n; i++) parts.push({
      x, y, vx: dir ? dir * rnd(spdX * 0.3, spdX) : rnd(-spdX, spdX), vy: -rnd(0, up),
      l: rnd(life[0], life[1]), c: pick(cols), g: grav });
  }

  // ---------------- procedural track ----------------
  // Every new piece is ridden first by a ghost of the streamer's wheel, with the same physics, and only
  // kept if the ghost gets through: it never falls, stalls in a loop or hits a die. When it can't, the
  // piece is rebuilt with what it needs (a boost pad before a gap or a loop, just strong enough) or made
  // easier. Nothing pushes the streamer's wheel that isn't on the track: boost pads only come before
  // gaps and loops, and springs only before dice and chip stacks.
  let pieces = [], genX = -200, lastType = '';
  function push(p) { p.x0 = genX; p.x1 = genX + p.len; genX = p.x1; pieces.push(p); return p; }

  function flat(len) { const p = push({ type: 'flat', len }); p.g = () => BASE; return p; }

  // (with o.belt, a chain lift up its near side, for when it's too steep to coast up)
  function hill(o) {
    if (o.power) boost(o.power);
    const { A, L } = o;
    const p = push({ type: 'hill', len: L });
    p.g = x => BASE - A * (1 - Math.cos(2 * Math.PI * (x - p.x0) / L)) / 2;
    if (o.belt) p.belts = [{ a: p.x0, b: p.x0 + L / 2, v: CHAIN }];
  }

  // The base of the track itself rises a few pixels (on scaffolding) or sinks a little for a stretch.
  function level(o) {
    if (o.power) boost(o.power);
    const r = 30, p = push({ type: 'level', len: o.L + 2 * r });
    p.g = x => { const u = x - p.x0; return BASE - o.D * smooth(clamp(Math.min(u, p.len - u) / r, 0, 1)); };
    if (o.belt) p.belts = [o.D > 0 ? { a: p.x0, b: p.x0 + r, v: CHAIN } : { a: p.x1 - r, b: p.x1, v: CHAIN }];
  }

  function bumps() {
    const L = ri(48, 80);
    const p = push({ type: 'bumps', len: L });
    p.g = x => { const t = x - p.x0; return BASE - 3 * Math.abs(Math.sin(t * Math.PI / 9)) * Math.sin(Math.PI * t / L); };
  }

  // A boost pad brings a wheel up to `power` (if it's going slower); the stronger, the longer the pad.
  function boost(power) {
    const pad = Math.round(10 + (power - 120) / 8);
    const p = push({ type: 'boost', len: pad + 20 });
    p.g = () => BASE; p.pa = p.x0 + 8; p.pb = p.pa + pad; p.trig = p.pa;
    // (a chat wheel that's parked to talk only gets the sparks, so its bubble stays put)
    p.onTrig = w => { if (w.phase !== 'talk' && w.v < power) { w.v = power; w.boostT = 1.2; }
      emit(w.x, w.y + 2, 10, [C.boostA, C.boostB, '#fff'], 50, 40, 100); };
  }

  // ---- launchers ----
  // Everything that throws a wheel into the air throws it over or into something: across a gap, over a
  // die or a chip stack, or up into the floating bumpers. A ramp or a flipper only ever goes at a gap; a
  // spring, a pinball slingshot kicker or a pop bumper (launcher()) can go at any of them. Each one's
  // launch point is `lx`. Chat wheels are steered, at speeds of their own, so a launcher with `to` set gives
  // them the speed to get past it.
  const VIAS = ['spring', 'kicker', 'bumper'];
  const aimed = (w, p, vx, vy) => w.main || p.to == null ? vx : Math.max(vx, (p.to - w.x) * G / (2 * Math.max(1, vy)));
  function launcher(via, power, dir) {
    if (via === 'kicker') return kicker({ dir, power });
    if (via === 'bumper') return popBumper(power);
    return spring(power);
  }

  // A spring pad: it throws a wheel up at `power` (over a die or a chip stack, p.hazard, or anything else).
  function spring(power) {
    const p = push({ type: 'spring', len: 14 });
    p.g = () => BASE; p.pa = p.x0 + 2; p.pb = p.x0 + 12; p.trig = p.lx = p.x0 + 7; p.spring = 0;
    p.onTrig = w => {
      let vy = power;
      if (!w.main && p.hazard) {
        // a chat wheel on its way in or out sometimes misses the spring and rolls into the die...
        if (w.phase !== 'talk' && Math.random() < CRASH[w.phase]) { w.doomed = p.hazard; return; }
        // ...otherwise it goes at its own speed, so it's thrown high enough to peak over the die
        vy = Math.max(power, G * (p.hazard.hx - w.x) / Math.max(30, w.v));
      }
      vy = vyCap(w, vy);
      w.mode = 'air'; w.vx = aimed(w, p, w.v, vy); w.vy = -vy; w.gvy = null;
      if (!SIM) p.spring = 1;
      emit(w.x, w.y + RW, 14, ['#ffef5a', '#fff', C.pad], 45, 70, 150, [0.4, 0.9]);
    };
    return p;
  }

  function jump(o) {
    if (o.power) boost(o.power);
    if (o.via) {   // a spring, kicker or pop bumper at the edge, instead of a ramp, and a level landing
      flat(8);
      const L = launcher(o.via, o.lp, 'long');
      const gp = push({ type: 'gap', len: o.gap }); gp.g = () => null;
      const l = push({ type: 'land', len: o.ll }); l.g = () => BASE;
      L.to = gp.x1 + 6;
      return;
    }
    const { Hr, rl, gap, ll } = o, Hl = Math.round(Hr * 0.6);
    const r = push({ type: 'ramp', len: rl });
    r.g = x => { const t = (x - r.x0) / rl; return BASE - Hr * t * t; };
    r.launch = true; r.slope = 2 * Hr / rl; r.Hr = Hr; r.gap = gap; r.drop = Hr - Hl;
    const gp = push({ type: 'gap', len: gap }); gp.g = () => null;
    const l = push({ type: 'land', len: ll }); l.g = x => BASE - Hl * (1 - (x - l.x0) / ll);
  }

  function loop(o) {
    // (no pad when the wheel already has the speed, like at the bottom of a coaster drop)
    if (o.power) boost(o.power);
    if (o.run) flat(o.run);
    // off = 0: in and out at the same spot, so the loop is a true circle
    const R = o.R, off = 0;
    const p = push({ type: 'loop', len: R * 2 + off + 12, R, off });
    p.g = () => BASE; p.ex = p.x0 + R + 4; p.trig = p.ex;
    p.roulette = Math.random() < 0.5;   // half the loops are roulette wheels
    p.onTrig = w => {
      w.mode = 'loop'; w.loop = p; w.th = 0;
      // the streamer's wheel goes round on the speed it brought; steered chat wheels get the speed it takes
      w.v0 = w.main ? w.v : Math.max(w.v, Math.sqrt(5.4 * G * (R - RW)));
    };
  }

  // ---- casino & pinball pieces ----
  // Dice and chip stacks sit on the track with a spring before them, placed so a wheel going at the
  // ghost's speed peaks right over the top.
  const CHIP_COLS = [['#e8344e', '#a3203a'], ['#2f6bff', '#1d43a8'], ['#22b35e', '#147a3e'], ['#8a5cff', '#5a3aad'], ['#3a3450', '#1f1a2e']];
  function hazard(o) {
    flat(16);
    const s = launcher(o.via, o.power, o.dir);
    const p = push({ type: 'hazard', len: Math.max(20, s.lx + o.dist + 30 - s.x1) }); p.g = () => BASE;
    Object.assign(p, o.look, { hx: Math.max(s.lx + o.dist, s.x1 + o.look.hw) });
    if (s.type === 'spring') s.hazard = p; else s.to = p.hx + p.hw / 2 + RW + 4;
  }

  // A pinball pop bumper: a wheel that rolls into it gets kicked up into the air.
  function popBumper(power) {
    const p = push({ type: 'bumper', len: 34 }); p.g = () => BASE;
    p.bx = p.x0 + 26; p.lit = 0; p.kick = power;
    p.touch = p.lx = p.bx - 4 - RW;
    p.onTouch = w => {
      if (!SIM) p.lit = 1;
      const vy = vyCap(w, p.kick);
      w.mode = 'air'; w.vx = aimed(w, p, clamp(w.v, 70, 110), vy); w.vy = -vy; w.gvy = null;
      emit(p.bx, BASE - 5, 12, ['#ffe600', '#fff', '#ff3b5c'], 60, 60, 120);
      popup(p.bx, BASE - 14, '+' + pick([100, 250, 500]), '#ffe600');
    };
    return p;
  }

  // Three drop targets in a row that wheels knock flat; they pop back up a few seconds later.
  const TARGET_COLS = ['#ff3bd0', '#3ff8ff', '#ffe600'];
  function targets() {
    const p = push({ type: 'targets', len: 60 }); p.g = () => BASE;
    p.ts = TARGET_COLS.map((c, i) => ({ x: p.x0 + 24 + i * 6, c, down: 0 }));
  }

  // A pinball flipper hinged on the edge of a gap, sticking out over it; when a wheel reaches the edge it
  // swings up and swats the wheel across (at the speed it came with, so a wide gap gets a boost pad first).
  function flipper(o) {
    if (o.power) boost(o.power);
    const gap = o.gap, kick = 210;
    const p = push({ type: 'flipper', len: 36 }); p.g = () => BASE;
    p.fx = p.x1; p.trig = p.x1 - 1; p.up = 0;
    p.onTrig = w => {
      if (!SIM) p.up = 1;
      const vy = vyCap(w, kick), t = 2 * vy / G;
      w.mode = 'air'; w.vy = -vy; w.vx = w.main ? w.v : Math.max(w.v, (1 + gap + 10) / t); w.gvy = null;
      emit(p.fx + 6, BASE - 2, 8, ['#fff', '#ff3b5c'], 40, 50, 150);
    };
    const gp = push({ type: 'gap', len: gap }); gp.g = () => null;
  }

  // The slot machine set piece's reels: a wheel going through underneath (at p.cx) spins them, and sometimes
  // it's 7-7-7.
  const SYMS = ['seven', 'cherry', 'bell', 'diamond'];
  function slotMachine(p) {
    p.trig = p.cx; p.payAt = 0; p.won = -9;
    p.reels = [0, 1, 2].map(() => ({ s: ri(0, SYMS.length - 1), until: 0 }));
    p.onTrig = () => {
      if (SIM || p.reels.some(r => r.until > simT)) return;   // a ghost doesn't play; or still spinning
      const jackpot = Math.random() < 0.18;
      p.reels.forEach((r, i) => { r.until = simT + 0.5 + i * 0.35; r.s = jackpot ? 0 : ri(0, SYMS.length - 1); });
      if (!jackpot && p.reels.every(r => r.s === 0)) p.reels[2].s = 1;   // 7-7-7 only when it's meant to be
      if (jackpot) p.payAt = p.reels[2].until;
    };
  }

  // A roller-coaster run: a chain lift hauls wheels up at a steady crawl, then dips and a drop back
  // down. The drop's speed can carry a wheel round a loop at the bottom with no boost pad.
  const CHAIN = 45;
  function coaster(o) {
    const { Hc, dips, D } = o, L = Math.round(Hc * 2.6), Ld = Math.round(Hc * 1.7);
    const lift = push({ type: 'lift', len: L }); lift.chain = CHAIN;
    lift.g = x => BASE - Hc * smooth((x - lift.x0) / L);
    for (let i = 0; i < dips; i++) {
      const d = push({ type: 'dip', len: 40 });
      d.g = x => BASE - Hc + D * Math.sin(Math.PI * (x - d.x0) / 40) ** 2;
    }
    const drop = push({ type: 'drop', len: Ld });
    drop.g = x => BASE - Hc * (1 - smooth((x - drop.x0) / Ld));
    if (o.loopR) { flat(4); loop({ R: o.loopR }); }
  }

  // A row of dominoes: the first wheel to roll into it tips the first one over, and the rest go down one
  // after another ahead of it. They stand back up a few seconds after the last one falls.
  function dominoes() {
    const n = ri(9, 15), p = push({ type: 'dominoes', len: 20 + n * 4 + 12 }); p.g = () => BASE;
    p.ds = Array.from({ length: n }, (_, i) => p.x0 + 14 + i * 4);
    p.start = -1; p.trig = p.ds[0] - RW;
    p.onTrig = () => { if (!SIM && p.start < 0) p.start = simT; };
  }

  // Things to ride through: an arch over the track (a striped circus one, or a neon casino one with a sign),
  // a tunnel the wheels vanish into for a moment, and a glass pipe you can see them roll along inside.
  function arch() {
    const p = push({ type: 'arch', len: 44 }); p.g = () => BASE;
    p.ax = p.x0 + 22; p.neon = Math.random() < 0.5;
    p.cols = pick(TENT_COLS); p.sign = p.neon ? pick(['WIN', 'LUCKY', 'VEGAS']) : 'CIRCUS';
  }
  // Tunnels are set pieces (see SETS): mini-golf obstacles the wheels go in one end of and come out the
  // other. They stand 62 px tall, so a strip shorter than the default gets plain deco tunnels instead.
  function tunnel() {
    if (ROWS >= 72) {
      const set = pick(Object.keys(SETS)), s = SETS[set], art = s.img ??= s.make();
      const p = push({ type: 'tunnel', len: art.width + 6 }); p.g = () => BASE;
      Object.assign(p, { set, art, ax: p.x0 + 3, ph: rnd(0, 5), cx: p.x0 + 3 + art.width / 2 });
      // a wheel going in sets its scene going (see SETS), with a shout from the monster now and then
      const go = () => {
        if (SIM || simT - (p.active ?? -9) < 3) return;
        p.active = simT;
        if (s.shout) popup(p.cx, BASE + 6 - art.height, s.shout, '#fffaf0');
      };
      if (set === 'slots') { slotMachine(p); const spin = p.onTrig; p.onTrig = w => { spin(w); go(); }; }
      else { p.trig = p.x0 + 4; p.onTrig = go; }
      return;
    }
    const art = bakeDecoTunnel(ri(56, 90)), p = push({ type: 'tunnel', len: art.width + 6 }); p.g = () => BASE;
    Object.assign(p, { art, ax: p.x0 + 3 });
  }
  function pipe() {
    const p = push({ type: 'pipe', len: ri(60, 110) }); p.g = () => BASE;
  }

  // Two tracks at once, and each wheel keeps to one of them (see groundFor): a braid, two tracks weaving
  // over and under each other with the second drawn in front of the wheels; or a split, where one lane
  // stays down while the other climbs onto an upper deck and comes back down to join it. The streamer's
  // wheel's lane is picked here, so the ghost rides the same one.
  function braid(o) {
    if (o.power) boost(o.power);
    const { L, A } = o, p = push({ type: 'braid', len: L }), s = x => (x - p.x0) / L;
    p.lanes = [x => BASE - A * Math.sin(Math.PI * s(x)) ** 2, x => BASE - A * 0.55 * Math.sin(2 * Math.PI * s(x)) ** 2];
    p.g = p.lanes[0]; p.mainLane = o.lane; p.frontLane = 1;
    if (o.belt) p.belts = [{ a: p.x0, b: p.x0 + L / 2, v: CHAIN, lane: 0 }, { a: p.x0, b: p.x0 + L / 4, v: CHAIN, lane: 1 }, { a: p.x0 + L / 2, b: p.x0 + L * 3 / 4, v: CHAIN, lane: 1 }];
  }
  function split(o) {
    if (o.power) boost(o.power);
    const { A } = o, up = rampFor(A), L = o.L + 2 * (up - 36), p = push({ type: 'split', len: L });
    p.lanes = [() => BASE, x => { const u = x - p.x0; return BASE - A * smooth(clamp(Math.min(u, L - u) / up, 0, 1)); }];
    p.g = p.lanes[0]; p.mainLane = o.lane; p.ramp = up; p.A = A;   // (its deck hangs from a suspension bridge)
    if (o.belt) p.belts = [{ a: p.x0, b: p.x0 + up, v: CHAIN, lane: 1 }];
  }

  // How long a ramp up to height h is: long enough that a wheel coming over the top at speed stays on it
  // rather than hopping off the crest.
  const rampFor = h => Math.max(36, Math.round(h * 2.4));
  // An upper deck to branch off onto: like a split's upper lane, it ramps up from the track and runs along
  // at height to `xe`, where whatever's at the end of it takes over (girders or a funnel). Wheels on the
  // lower lane carry straight on underneath. Returns the piece; lane 1 is the deck.
  function deck(type, H, run, after) {
    const ramp = rampFor(H), p = push({ type, len: ramp + run + after }), xs = p.x0 + ramp, xe = xs + run;
    p.lanes = [() => BASE, x => x >= xe ? BASE : BASE - H * smooth(clamp((x - p.x0) / ramp, 0, 1))];
    p.g = p.lanes[0]; p.xs = xs; p.xe = xe; p.top = BASE - H; p.A = H;
    return p;
  }

  // Girders, Donkey Kong style, below the end of an upper deck: the wheel rolls off the deck's end round a
  // banked hairpin onto a girder sloping back to the left, round another hairpin onto the next, sloping
  // right, and down a curved ramp off the bottom one onto the track. The track can't be in two places at
  // one x, so the girders are a path the wheels follow (see move()'s 'path' mode), keeping their speed
  // and gaining more downhill.
  const TIER = 11, TILT = 4;
  function girders(o) {
    if (o.power) boost(o.power);
    const { w } = o, H = 2 * TIER + TILT + 13, p = deck('girders', H, w, 24), top = p.top, xe = p.xe, xl = xe - w + 2;
    p.mainLane = o.lane;
    if (o.belt) p.belts = [{ a: p.x0, b: p.xs, v: CHAIN, lane: 1 }];
    const t1 = { xa: xl, xb: xe, ya: top + TIER + TILT, yb: top + TIER }, t2 = { xa: xl, xb: xe - 1, ya: top + 2 * TIER, yb: top + 2 * TIER + TILT };
    const pts = [], turns = [];
    // a hairpin: half an ellipse from (x, y0) down to (x, y1), bulging out sideways (dir) by rx
    const hairpin = (x, y0, y1, dir, rx) => {
      const cy = (y0 + y1) / 2, ry = (y1 - y0) / 2;
      turns.push({ x, cy, rx, ry, dir });
      for (let i = 0; i <= 12; i++) { const a = -Math.PI / 2 + Math.PI * i / 12; pts.push([x + dir * rx * Math.cos(a), cy + ry * Math.sin(a)]); }
    };
    hairpin(xe, top - RW, t1.yb - RW, 1, 6);
    hairpin(xl, t1.ya - RW, t2.ya - RW, -1, 6);
    // then along the bottom girder and down a curve that ends level with the track
    const P0 = [t2.xb, t2.yb - RW], P3 = [xe + 20, BASE - RW], P1 = [P0[0] + 6, P0[1] + 2], P2 = [P3[0] - 9, P3[1]];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12, u = 1 - t, b = (j) => u * u * u * P0[j] + 3 * u * u * t * P1[j] + 3 * u * t * t * P2[j] + t * t * t * P3[j];
      pts.push([b(0), b(1)]);
    }
    let s = 0;
    p.path = pts.map((q, i) => ({ x: q[0], y: q[1], s: i ? (s += Math.hypot(q[0] - pts[i - 1][0], q[1] - pts[i - 1][1])) : 0 }));
    p.tiers = [t1, t2]; p.turns = turns; p.exit = p.path.slice(-13);
    p.trig = xe; p.onTrig = wh => { if (laneOf(wh, p) === 1) { wh.mode = 'path'; wh.path = p; wh.s = 0; wh.v = Math.max(45, wh.v); } };
  }

  // A pinball slingshot kicker: hit it and it fires the wheel off at its angle, straight up or long and low
  // (o.power, if given, instead of its usual upward kick).
  const KICKS = { up: [0.5, 215], long: [1.35, 120] };
  function kicker(o) {
    const p = push({ type: 'kicker', len: 26 }); p.g = () => BASE;
    p.kx = p.x0 + 18; p.trig = p.lx = p.kx - 2; p.dir = o.dir; p.lit = 0;
    p.onTrig = w => {
      const [fx, ky] = KICKS[p.dir], vy = vyCap(w, o.power ?? ky);
      w.mode = 'air'; w.vx = aimed(w, p, w.v * fx, vy); w.vy = -vy; w.gvy = null;
      if (!SIM) p.lit = 1;
      emit(p.kx, BASE - 3, 10, ['#ffe600', '#fff', '#3ff8ff'], 50, 60, 150);
      popup(p.kx, BASE - 12, '+' + pick([100, 200]), '#3ff8ff');
    };
    return p;
  }

  // A launcher throws wheels up into pop bumpers floating over the track, laid out along the way it'll go:
  // each time it comes down to the bumpers' height (o.h, stepping by o.drop each time), a bumper just behind
  // and under it knocks it up and on again, at the angle o.ang, so it bounces along in a regular pattern
  // and comes down well on its way. They're placed by riding a wheel through just as the ghost will (from
  // where the ghost is now), putting each bumper where it comes down; the ghost then goes exactly the same
  // way, and the piece is only kept if it bounces off at least two and never back the way it came.
  function pinfield(o) {
    flat(10);
    launcher(o.via, o.power, 'up');
    const m = Math.hypot(...o.ang), nx = o.ang[0] / m, ny = o.ang[1] / m;
    const p = push({ type: 'pinfield', len: 600 }); p.g = () => BASE; p.bs = []; p.bx0 = p.x0;
    const t = Object.assign(wheel(0, CRUISE, MAIN_PAL), stateOf(ghost), { main: true, ghost: true }), was = SIM;
    SIM = true;
    let up = false, end = p.x0;
    for (let n = 0; n < 240 * 8 && p.bs.length < o.n; n++) {
      const x0 = t.x;
      step(t, STEP);
      if (t.fell || t.crashed || t.stalled) break;
      if (t.mode === 'air') up = true; else if (up) break;   // (back down on the track)
      // (coming down properly, so it was clear of the bumper a step before)
      if (t.mode !== 'air' || t.vy < 40 || t.y < BASE - o.h + o.drop * p.bs.length) continue;
      const d = o.r + RW - 0.01, b = { x: t.x - nx * d, y: t.y - ny * d, r: o.r, lit: 0 };
      if (b.y + o.r > BASE - 2 * RW - 3) break;   // (wheels on the track pass under them)
      p.bs.push(b); p.bx0 = Math.min(p.bx0, b.x - o.r); end = b.x;
      bounceOff(t, x0);   // it bounces off it right here, just as the ghost will
    }
    SIM = was;
    p.len = Math.max(30, Math.round(end - p.x0 + 40)); p.x1 = p.x0 + p.len; genX = p.x1;
  }
  function bounceOff(w, x0) {
    for (const p of pieces) {
      if (!p.bs || p.type !== 'pinfield' || p.x1 < x0 - 10 || p.bx0 > w.x + 10) continue;
      for (const b of p.bs) {
        const dx = w.x - b.x, dy = w.y - b.y, d = Math.hypot(dx, dy);
        if (d >= b.r + RW || d === 0) continue;
        const nx = dx / d, ny = dy / d, vn = w.vx * nx + w.vy * ny;
        if (vn >= 0) continue;
        w.vx -= 2 * vn * nx; w.vy -= 2 * vn * ny;                       // bounce off its round face, with a kick
        const sp = Math.hypot(w.vx, w.vy), k = Math.min(1.12, 260 / Math.max(1, sp)); w.vx *= k; w.vy *= k;
        w.x = b.x + nx * (b.r + RW); w.y = b.y + ny * (b.r + RW);
        if (w.vy < 0) w.vy = -vyCap(w, -w.vy);   // never out of the top
        w.hits = (w.hits || 0) + 1;
        if (w.ghost && w.vx < 20) w.crashed = true;   // (bounced back the way it came: not kept)
        if (!SIM) b.lit = 1;
        emit(b.x + nx * b.r, b.y + ny * b.r, 8, ['#ffe600', '#fff', '#ff3bd0'], 50, 50, 120);
        popup(b.x, b.y - b.r - 4, '+' + pick([250, 500, 1000]), '#ffe600');
      }
    }
  }

  // A glass coin funnel at the end of an upper deck: the wheel rolls off the deck into its rim, spirals
  // down inside, faster and tighter, and shoots out of the spout onto the track (see move()'s 'funnel'
  // mode). Wheels on the lower lane pass underneath.
  const FUNNEL_TIME = 2.4;
  // the height of the funnel's middle k of the way down: its back rim is level with the deck
  const funnelY = (p, k) => p.top + 0.3 * p.R + k * (p.H - 0.3 * p.R);
  function funnel(o) {
    if (o.power) boost(o.power);
    const { H, R } = o, p = deck('funnel', H, 24 + R, R + 30);
    p.mainLane = o.lane; p.fx = p.xe; p.R = R; p.H = H;
    if (o.belt) p.belts = [{ a: p.x0, b: p.xs, v: CHAIN, lane: 1 }];
    p.trig = p.xe; p.onTrig = w => { if (laneOf(w, p) === 1) { w.mode = 'funnel'; w.fun = p; w.th = -Math.PI / 2; w.k = 0; w.fv = w.v; } };
  }

  // Traffic cones that go flying when a wheel clips them (just for show: nobody's slowed down).
  function cones(o) {
    const p = push({ type: 'cones', len: 24 + o.n * 9 }); p.g = () => BASE;
    p.cs = Array.from({ length: o.n }, (_, i) => ({ x: p.x0 + 14 + i * 9, hit: false }));
  }
  function hitCone(c, w) {
    Object.assign(c, { hit: true, fx: c.x, fy: BASE - 4, vx: Math.max(40, w.v * 0.7) + rnd(0, 40), vy: -rnd(90, 150), rot: 0, spin: rnd(8, 16) });
    emit(c.x, BASE - 3, 5, ['#ff7a1a', '#fff'], 30, 40, 160);
  }
  // which lane a wheel's on in a two-lane piece (picked the first time it's asked), and the ground under it
  function laneOf(w, p) {
    w.lanes ??= new Map();
    if (!w.lanes.has(p)) {
      let lane = w.main ? p.mainLane : Math.random() < 0.5 ? 0 : 1;
      // one that turns up partway along (or in the air) takes whichever lane it's actually at
      if (w.x > p.x0 + 2) { const y = w.y + RW; lane = Math.abs(p.lanes[1](w.x) - y) < Math.abs(p.lanes[0](w.x) - y) ? 1 : 0; }
      w.lanes.set(p, lane);
      if (w.lanes.size > 40) w.lanes.delete(w.lanes.keys().next().value);
    }
    return w.lanes.get(p);
  }
  function groundFor(w, x) {
    const p = pieceAt(x);
    return !p ? BASE : p.lanes ? p.lanes[laneOf(w, p)](x) : p.g(x);
  }

  const WEIGHT = { hill: 3, jump: 5, loop: 2, bumps: 2, hazard: 4, flipper: 2, targets: 1.5, coaster: 2.5, dominoes: 1.5,
    arch: 1.5, tunnel: 2.5, pipe: 1.5, braid: 1.5, split: 1.5, girders: 1.5, pinfield: 2.5, funnel: 1.2, cones: 1.5, level: 1.2 };
  const MAKE = { hill, jump, loop, bumps, hazard, flipper, targets, coaster, dominoes, arch, tunnel, pipe, braid, split,
    girders, pinfield, funnel, cones, level };
  // pieces that throw wheels into the air get a longer flat after them to land on
  const AIRY = new Set(['jump', 'flipper', 'hazard', 'coaster', 'pinfield', 'funnel', 'girders']);
  // Everything fits within the strip (`rows`), whatever the size of the source; a taller strip than the
  // default lets loops, coasters, decks and bumpers go higher (UP is how much taller it is).
  const UP = Math.max(0, ROWS - 72);
  const MAX_R = Math.max(14, Math.min(21 + Math.floor(UP / 6), Math.floor((ROWS - 12) / 2)));

  // The ways to build each kind of piece, the most natural first. The first one the ghost gets through
  // is kept, so a boost pad only turns up when the jump or loop really needs one, and only as strong as
  // it needs to be.
  // The ways up a climb of h px: a chain lift, or (now and then first) a boost pad before it, as strong as
  // coasting up h takes, or a bit more.
  function climb(o, h) {
    const need = Math.min(200, Math.ceil(Math.sqrt(2 * 0.7 * G * h) / 10) * 10 + 20);
    const belt = { ...o, belt: true }, pads = [{ ...o, power: need }, { ...o, power: Math.min(200, need + 30) }];
    return Math.random() < 0.35 ? [...pads, belt] : [belt, ...pads];
  }
  function options(k) {
    if (k === 'jump') {
      const base = { Hr: ri(8, 15), rl: ri(22, 30), gap: ri(22, 60), ll: ri(26, 36) };
      const ramp = [base, ...[130, 160, 190].map(power => ({ ...base, power })), { ...base, gap: 22, power: 200 }];
      // or now and then a spring, a kicker or a pop bumper at the edge of the gap instead of a ramp
      const via = pick(['ramp', 'ramp', ...VIAS]), lps = { spring: [190, 220], kicker: [120, 150], bumper: [150, 180] };
      return via === 'ramp' ? ramp : [...lps[via].flatMap(lp => [{ ...base, via, lp }, { ...base, via, lp, power: 150 }]), ...ramp];
    }
    if (k === 'flipper') {
      const gap = ri(30, 60);
      return [{ gap }, { gap, power: 140 }, { gap, power: 180 }, { gap: 26 }];
    }
    if (k === 'hill') { const A = rnd(5, 13 + UP / 6), L = ri(50, 90); return [{ A, L }, { A: Math.min(A, 8), L }, ...climb({ A, L }, A)]; }
    if (k === 'girders') { const w = ri(50, 70); return [{ w, lane: 1 }, ...climb({ w, lane: 1 }, 2 * TIER + TILT + 13), { w, lane: 0 }]; }
    if (k === 'pinfield') {
      // a few patterns (how high, stepping down or up or level, and how hard they knock it on), each
      // launched by a spring, a kicker or a pop bumper
      const top = Math.min(44 + (UP >> 1), ROWS - 26), pw = { spring: 230, kicker: 215, bumper: 200 }, via = pick(VIAS);
      const pat = v => ({ n: ri(3, 5), h: ri(24, top), drop: pick([0, 0, 3, 5, -3]), r: ri(3, 4), ang: pick([[0.15, -0.99], [0.25, -0.97], [0.35, -0.94]]), via: v, power: pw[v], v: ghost.v });
      return [pat(via), pat(via), pat('spring'), pat(via), pat('spring')];
    }
    if (k === 'funnel') {
      const H = ri(26, Math.max(26, Math.min(36 + Math.floor(UP / 3), ROWS - 30))), R = ri(14, 18);
      return [{ H, R, lane: 1 }, ...climb({ H, R, lane: 1 }, H), { H: 26, R: 14, lane: 1, belt: true }, { H, R, lane: 0 }];
    }
    if (k === 'cones') return [{ n: ri(3, 6) }];
    if (k === 'level') { const D = pick([-3, -4, 5, 6, 8, 10]), L = ri(90, 200); return [{ D, L }, ...climb({ D, L }, Math.abs(D)), { D: 5, L: 90, belt: true }]; }
    if (k === 'loop') {
      // going round needs about √(5.6·g·r) at the bottom: no pad if it's already going that fast,
      // otherwise start from that and go up
      const R = ri(14, MAX_R), need = Math.ceil(Math.sqrt(5.6 * G * (R - RW)) / 10) * 10;
      return [{ R }, ...[0, 10, 20, 40].map(d => ({ R, run: ri(6, 14), power: Math.min(200, need + d) })), { R: 14, run: 6, power: 200 }];
    }
    if (k === 'braid' || k === 'split') {
      // the streamer's wheel takes either lane, whichever the ghost gets along
      const L = ri(150, 200), A = ri(14, Math.max(14, Math.min(24 + Math.floor(UP / 3), ROWS - 40))), lane = ri(0, 1);
      return [{ L, A, lane }, ...climb({ L, A, lane }, A), { L, A, lane: 1 - lane }, ...climb({ L, A, lane: 1 - lane }, A), { L, A: 12, lane: 0, belt: true }];
    }
    if (k === 'coaster') {
      // as high as fits in the strip, with a loop at the bottom of the drop when the drop is fast enough
      const Hc = ri(18, Math.max(18, Math.min(34 + (UP >> 1), ROWS - 26))), dips = ri(1, 3), D = ri(6, 12);
      return [{ Hc, dips, D, loopR: ri(14, MAX_R) }, { Hc, dips, D, loopR: 14 }, { Hc, dips, D }, { Hc: 18, dips: 1, D: 6 }];
    }
    if (k === 'hazard') {
      const die = Math.random() < 0.5, n = ri(3, 5);
      const look = die ? { kind: 'die', hw: 7, hh: 7, face: ri(1, 6) }
        : { kind: 'chips', hw: 8, hh: n * 2 + 1, n, cols: Array.from({ length: n }, () => pick(CHIP_COLS)) };
      // thrown hard enough to rise well above it, from far enough back that the arc peaks over it at the
      // ghost's speed: by a spring, or a kicker, or a pop bumper
      const power = Math.sqrt(2 * G * (look.hh + 9)), at = (vx, vy, f = 1) => Math.round(vx * vy / G * f), F = [1, 0.85, 1.15];
      const spring = F.map(f => ({ look, via: 'spring', power, dist: at(ghost.v, power, f) })).concat({ look, via: 'spring', power: power + 30, dist: at(ghost.v, power + 30) });
      const kick = ['up', 'long'].flatMap(dir => { const vy = Math.max(KICKS[dir][1], power); return F.map(f => ({ look, via: 'kicker', dir, power: vy, dist: at(ghost.v * KICKS[dir][0], vy, f) })); });
      const bump = F.map(f => ({ look, via: 'bumper', power: power + 20, dist: at(clamp(ghost.v, 70, 110), power + 20, f) }));
      const via = pick(VIAS);
      return via === 'kicker' ? [...kick, ...spring] : via === 'bumper' ? [...bump, ...spring] : [...spring, ...kick, ...bump];
    }
    return [{}];
  }

  // ---- the ghost: rides each new piece before it's kept ----
  // The wheels all move in the same fixed steps (STEP), and the streamer's wheel starts where the ghost
  // did, so it rides each piece exactly the way the ghost did, whatever the frame rate.
  let SIM = false;   // true while a ghost rides (no sparks, scores or flashing machines)
  const STEP = 1 / 240;
  const ghost = Object.assign(wheel(RW + 2, CRUISE, MAIN_PAL), { main: true, ghost: true });
  const STATE = ['x', 'y', 'v', 'vx', 'vy', 'mode', 'loop', 'th', 'v0', 'gvy', 'boostT', 'rot', 'path', 's', 'fun', 'k', 'fv', 'plat'];
  const stateOf = w => Object.fromEntries(STATE.map(k => [k, w[k]]));
  // Rides up to just short of the end of the track built so far (so it never sees past it, where the
  // ground isn't there yet). False if it falls, stalls in a loop or hits something on the way.
  function ride(w, rec) {
    for (let n = 0; w.x < genX - 2; n++) {
      if (n > 240 * 20) return false;
      step(w, STEP);
      if (rec && n % 6 === 0) rec.push([w.x, w.y]);
      if (w.fell || w.stalled || w.crashed || w.y < H - ROWS - 20) return false;   // (or thrown out of the top)
    }
    return true;
  }
  function tryBuild(k, o) {
    const n = pieces.length, gx = genX, s = stateOf(ghost);
    MAKE[k](o);
    flat(AIRY.has(k) ? ri(40, 60) : ri(16, 40));
    SIM = true;
    // it has to work a little slower and a little faster too, for some room to spare (except among the
    // floating bumpers, where any difference sends a wheel somewhere else entirely; the streamer's wheel
    // repeats the ghost exactly anyway)
    const twin = f => Object.assign(wheel(0, CRUISE, MAIN_PAL), s, { main: true, ghost: true, v: s.v * f, vx: s.vx * f });
    const nr = ruins.length;
    if (RUINABLE.has(k) && Math.random() < 0.18) addRuin(pieces[n].x0, genX);   // (sometimes old track over it)
    const rec = Math.random() < 0.22 ? [] : null;   // (sometimes the ghost's way through gets coins along it)
    ghost.hits = 0;
    let ok = (k === 'pinfield' || (ride(twin(0.95)) && ride(twin(1.05)))) && ride(ghost, rec);
    if (ok && k === 'pinfield') { const pf = pieces.slice(n).find(q => q.bs); ok = pf.bs.length >= 2 && ghost.hits >= 2; }
    // and the next piece only starts once it's back on solid track
    while (ok && ghost.mode !== 'ground') { flat(10); ok = ride(ghost); }
    SIM = false;
    if (ok && rec) placeCoins(rec);
    if (!ok) { pieces.length = n; genX = gx; ruins.length = nr; Object.assign(ghost, s, { fell: false, stalled: false, crashed: false }); }
    return ok;
  }

  // Coins to collect: a patch of them strung along the way the ghost went, through the air or round a
  // loop just as well as along the ground, so the streamer's wheel (which goes the same way) always gets
  // them. Any wheel that touches one takes it; whoever takes a patch's last coin scores the lot.
  const coins = [];
  function placeCoins(rec) {
    const n = ri(5, 9), patch = { n: 0, got: 0 };
    let last = null;
    for (let i = ri(0, Math.max(0, rec.length - n * 5)); i < rec.length && patch.n < n; i++) {
      if (last && Math.hypot(rec[i][0] - last[0], rec[i][1] - last[1]) < 7) continue;
      coins.push({ x: rec[i][0], y: rec[i][1], patch, got: 0 }); patch.n++; last = rec[i];
    }
  }
  function takeCoins(all) {
    for (const c of coins) {
      if (c.got || c.x < camX - 20 || c.x > camX + W + 20) continue;
      for (const w of all) {
        if (w.deadUntil || Math.abs(w.x - c.x) > RW + 2 || Math.abs(w.y - c.y) > RW + 2) continue;
        c.got = simT; c.patch.got++;
        emit(c.x, c.y, 5, ['#ffd84a', '#fff3a8', '#fff'], 30, 30, 60, [0.2, 0.5]);
        if (c.patch.got === c.patch.n) popup(c.x, c.y - 9, '+' + c.patch.n * 10, '#ffd84a');
        break;
      }
    }
    for (let i = coins.length - 1; i >= 0; i--) if (coins[i].x < camX - 40) coins.splice(i, 1);
    for (let i = ruins.length - 1; i >= 0; i--) if (ruins[i].xb < camX - 100) ruins.splice(i, 1);
  }
  // a gold coin turning on its edge (or, just taken, floating up and fading)
  function drawCoins(cx, t) {
    for (const c of coins) {
      const x = Math.round(c.x - cx); if (x < -4 || x > W + 4) continue;
      let y = Math.round(c.y);
      if (c.got) { const a = (simT - c.got) / 0.4; if (a >= 1) continue; ctx.globalAlpha = 1 - a; y -= Math.round(a * 8); }
      // seen face on it's round (a column of 5 with shorter ones either side); edge on, a thin bar
      const hw = [2, 1, 0, 1][Math.floor(t * 8 + c.x * 0.13) & 3];
      for (let dx = -hw; dx <= hw; dx++) {
        const r = Math.abs(dx) === 2 || (hw === 1 && dx) ? 1 : 2;
        ctx.fillStyle = dx === hw && hw ? '#b8862a' : '#ffd84a'; ctx.fillRect(x + dx, y - r, 1, 2 * r + 1);
      }
      if (hw) px(x - hw + 1, y - 1, '#fff3a8');
      ctx.globalAlpha = 1;
    }
  }

  // Old broken track up on rickety wooden stilts, over the track now and then: the route never goes up
  // onto it, but a wheel that comes down on it rolls along it and drops off the end, and one that comes up
  // under it bounces off it. One or two stretches with a gap between, rusted, with a drooping broken end.
  const ruins = [];
  const RUINABLE = new Set(['hill', 'bumps', 'level', 'jump', 'hazard', 'cones', 'dominoes', 'targets', 'flipper']);
  function addRuin(x0, x1) {
    const span = x1 - x0; if (span < 50) return;
    const len = ri(34, Math.min(80, span - 10)), xa = Math.round(x0 + rnd(5, span - len - 5)), xb = xa + len;
    let top = BASE; for (let x = xa - 6; x <= xb + 6; x += 2) { const g = groundAt(x); if (g != null) top = Math.min(top, g); }
    const y = Math.round(top - 2 * RW - ri(8, 16));
    if (y < BASE - ROWS + 24) return;
    const segs = [];
    if (len > 50 && Math.random() < 0.6) { const c = Math.round(xa + len * rnd(0.35, 0.6)), g = ri(5, 9); segs.push({ a: xa, b: c, y, brokeB: true }, { a: c + g, b: xb, y, brokeA: true }); }
    else segs.push({ a: xa, b: xb, y });
    ruins.push({ xa, xb, y, segs, seed: ri(0, 1e6) });
  }
  // a wheel in the air meets a stretch of it: lands on top (rolling on), or knocks its head underneath
  function hitRuins(w, ay) {
    for (const r of ruins) {
      if (w.x < r.xa - 1 || w.x > r.xb + 1) continue;
      for (const sg of r.segs) {
        if (w.x < sg.a || w.x > sg.b) continue;
        const top = sg.y - RW, under = sg.y + 3 + RW;
        if (w.vy > 0 && ay <= top + 0.5 && w.y >= top) {
          w.y = top;
          if (w.vy > 170) { w.vy = -w.vy * 0.28; return; }   // a hard landing bounces a little first
          w.mode = 'plat'; w.plat = sg; w.v = Math.max(20, Math.abs(w.vx)); w.gvy = null;
          emit(w.x, sg.y, 4, ['#a85a30', '#e8d9b0'], 30, 30, 220);
          return;
        }
        if (w.vy < 0 && ay >= under - 0.5 && w.y < under) { w.y = under; w.vy = -w.vy * 0.4; emit(w.x, sg.y + 3, 4, ['#a85a30', '#6a3a22'], 30, 10, 200); return; }
      }
    }
  }
  function drawRuins(cx) {
    for (const r of ruins) {
      if (r.xb < cx - 10 || r.xa > cx + W + 10) continue;
      let h = r.seed;
      const rnd2 = () => ((h = Math.imul(h ^ (h >>> 15), 2246822519) + 0x9e3779b9 | 0) >>> 0) / 4294967296;
      // the stilts, down behind the track, with cross braces between; one now and then missing or leaning
      for (let x = r.xa + 2; x < r.xb - 1; x += 8) {
        const gone = rnd2() < 0.15, lean = rnd2() < 0.2 ? (rnd2() < 0.5 ? -1 : 1) : 0, sx = x - cx;
        if (gone) continue;
        for (let y = r.y + 3; y < BASE + 2; y++) px(sx + Math.round(lean * (y - r.y) / (BASE - r.y) * 3), y, '#5a3a28');
        if (x + 8 < r.xb - 1) for (let i = 0; i < 8; i++) { px(sx + i, r.y + 4 + Math.round(i * (BASE - r.y - 6) / 8), '#3a2418'); }
      }
      for (const sg of r.segs) {
        for (let x = Math.ceil(sg.a); x <= sg.b; x++) {
          const sx = x - cx;
          px(sx, sg.y, ((x * 7 + r.seed) % 9) ? '#a85a30' : '#6a6a60'); px(sx, sg.y + 1, '#7a3a22'); px(sx, sg.y + 2, '#4a2418');
          if (x % 5 === 0) px(sx, sg.y - 1, '#7a3a22');   // what's left of the rail
        }
        // a broken end droops down, bent
        if (sg.brokeB) for (let i = 0; i < 5; i++) { px(Math.round(sg.b + 1 + i / 2 - cx), sg.y + 1 + i, '#7a3a22'); px(Math.round(sg.b + 1 + i / 2 - cx), sg.y + 2 + i, '#4a2418'); }
        if (sg.brokeA) { px(Math.round(sg.a - 1 - cx), sg.y + 1, '#7a3a22'); px(Math.round(sg.a - 2 - cx), sg.y + 2, '#4a2418'); }
      }
    }
  }

  function gen() {
    while (genX < camX + W + 200) {
      if (genX < 40) { flat(40); SIM = true; ride(ghost); SIM = false; continue; }   // plain track where the wheels start
      const ks = Object.keys(WEIGHT).filter(k => k !== lastType);
      let r = Math.random() * ks.reduce((a, k) => a + WEIGHT[k], 0), k;
      for (k of ks) { r -= WEIGHT[k]; if (r <= 0) break; }
      if (options(k).some(o => tryBuild(k, o))) lastType = k;
      else { flat(24); SIM = true; ride(ghost); SIM = false; }
    }
  }

  function pieceAt(x) { for (const p of pieces) if (x >= p.x0 && x < p.x1) return p; return null; }
  function groundAt(x) { const p = pieceAt(x); return p ? p.g(x) : BASE; }

  // ---------------- physics ----------------
  // never throw a wheel so high it goes off the top of the strip (an upward speed, from where it is now)
  const vyCap = (w, vy) => Math.min(vy, Math.sqrt(2 * G * Math.max(4, w.y - Math.max(RW + 2, H - ROWS - 16))));

  // the source got taller or shorter: the track moves to its new bottom, and everything on it moves along
  function shiftDown(dy) {
    for (const w of [wh, ghost, ...riders]) { w.y += dy; w.trail.forEach(q => q.y += dy); w.ty = null; w.by = null; }
    for (const q of [...parts, ...pops, ...rings, ...DECOR, ...smoke, ...coins]) q.y += dy;
    for (const r of ruins) { r.y += dy; for (const sg of r.segs) sg.y += dy; }
  }

  // Coming up short on a gap. A jump the ghost comes up short on isn't kept, so this is only ever a chat
  // wheel (they go at steered speeds): it bonks off the side and scrambles up onto the ledge.
  function hitWall(w, ax) {
    if (w.ghost) { w.fell = true; return; }
    const lip = groundFor(w, w.x);
    w.x = ax; w.vx = Math.max(40, Math.abs(w.vx) * 0.5); w.vy = -Math.sqrt(2 * G * (w.y + RW - lip + 4));
    emit(w.x + RW, w.y, 6, ['#fff', C.top], 30, 30, 200);
  }

  function land(w, gy) {
    const impact = w.vy;
    w.y = gy - RW;
    emit(w.x, gy, Math.min(14, 2 + impact / 18 | 0), ['#e8d9b0', '#b8a888', C.top], 40, impact / 6, 220);
    if (impact > 170) { w.vy = -impact * 0.28; return; }   // little rebound on hard landings
    w.mode = 'ground'; w.v = Math.max(35, w.vx); w.gvy = null;
  }

  function launchRamp(w, p) {
    w.x = p.x1; w.y = BASE - p.Hr - RW;
    const a = Math.atan(p.slope);
    w.vx = w.v * Math.cos(a); w.vy = -vyCap(w, w.v * Math.sin(a));
    const t = (-w.vy + Math.sqrt(w.vy * w.vy + 2 * G * p.drop)) / G;
    const need = (p.gap + 8) / t;
    if (!w.main && w.vx < need) w.vx = need;   // steered chat wheels always clear it (the streamer's has the speed)
    w.mode = 'air'; w.gvy = null;
    emit(w.x, w.y + RW, 6, [C.top, '#fff'], 30, 30, 150);
  }

  function respawn(w) {
    if (w.ghost) { w.fell = true; return; }   // a piece the ghost falls off isn't kept
    let x = w.x; while (groundFor(w, x) == null) x += 2;
    w.x = x + 4; w.y = groundFor(w, w.x) - RW; w.mode = 'ground'; w.v = w.cruise; w.gvy = null;
    emit(w.x, w.y, 16, ['#fff', '#ccc', C.boostA], 50, 60, 80);
  }

  function step(w, dt) {
    if (w.deadUntil) return;   // blown up, waiting to get back on the track
    const x0 = w.x;
    move(w, dt);
    hazards(w, x0);
  }

  function move(w, dt) {
    if (w.boostT > 0) w.boostT -= dt;

    if (w.mode === 'ground') {
      // chatters' wheels are steered (see steerRiders), so they speed up and brake harder
      const cruise = w.cruise, grip = w.main ? 1 : 3;
      const sg = x => { const g = groundFor(w, x); return g == null ? w.y + RW : g; };
      const s = (sg(w.x + 0.75) - sg(w.x - 0.75)) / 1.5;
      const cs = 1 / Math.sqrt(1 + s * s), sn = s * cs;
      if (w.steer != null) w.v = w.steer;   // arriving and parked chat wheels go exactly as fast as steered
      else {
        // it rolls on at its cruising speed, but on the way uphill only its own momentum carries it (the
        // streamer's wheel, anyway): a climb it can't make gets a chain lift (see belts)
        w.v += G * sn * dt * 0.7;
        const pull = (cruise - w.v) * dt * grip * (w.v > cruise ? 0.6 : 1.2);
        if (!(w.main && sn > 0.01 && pull > 0)) w.v += pull;
      }
      w.v = w.main ? Math.min(200, Math.max(0, w.v)) : Math.min(RUSH_OUT, Math.max(0, w.v));
      if (w.ghost && w.v < 8) { w.stalled = true; return; }   // (a piece the ghost would grind to a halt on isn't kept)
      const on = pieceAt(w.x);
      if (on && on.chain) w.v = on.chain;   // a chain lift hauls everything up at its own pace
      if (on && on.belts) for (const bt of on.belts)
        if (w.x >= bt.a && w.x < bt.b && w.v < bt.v && (bt.lane == null || laneOf(w, on) === bt.lane)) w.v = bt.v;
      const px = w.x;
      w.x += w.v * cs * dt; w.rot += w.v * dt / RW;

      for (const p of pieces) {
        if (p.launch && px < p.x1 && w.x >= p.x1) { launchRamp(w, p); return; }
        if (p.trig != null && px < p.trig && w.x >= p.trig) { p.onTrig(w); if (w.mode !== 'ground') return; }
        if (p.touch != null && px < p.touch && w.x >= p.touch) { p.onTouch(w); return; }
        if (p.ts && !SIM) for (const t of p.ts) if (!t.down && px < t.x - RW + 1 && w.x >= t.x - RW + 1) knock(p, t);
        if (p.cs && !SIM) for (const c of p.cs) if (!c.hit && px < c.x - RW + 1 && w.x >= c.x - RW + 1) hitCone(c, w);
      }
      const ng = groundFor(w, w.x);
      if (ng == null) { w.mode = 'air'; w.vx = w.v * cs; w.vy = w.v * sn; return; }
      const nvy = (ng - RW - w.y) / dt;
      // ground falling away faster than gravity → catch some air off crests
      if (w.gvy != null && nvy - w.gvy > G * dt && w.v > 60) {
        w.mode = 'air'; w.vx = w.v * cs; w.vy = w.gvy; w.gvy = null; return;
      }
      w.gvy = nvy; w.y = ng - RW;

    } else if (w.mode === 'air') {
      const ax = w.x, ay = w.y;
      w.vy += G * dt; w.x += w.vx * dt; w.y += w.vy * dt; w.rot += w.vx * dt / RW;
      bounceOff(w, ax);   // floating bumpers
      hitRuins(w, ay);
      // a flipper swats anything that comes in low, rolling or not
      for (const p of pieces) if (p.type === 'flipper' && ax < p.trig && w.x >= p.trig && w.y + RW >= BASE - 5) { p.onTrig(w); return; }
      const gy = groundFor(w, w.x);
      if (gy != null && w.vy > 0 && w.y + RW >= gy) {
        // coming in over the far edge of a gap below its lip: it hits the side and drops into the gap
        if (groundFor(w, ax) == null && w.y + RW - gy > 3) hitWall(w, ax);
        else land(w, gy);
      }
      if (w.y > H + 40) respawn(w);

    } else if (w.mode === 'plat') {
      // rolling along a stretch of the old track, until it drops off the end
      const sg = w.plat;
      if (w.steer != null) w.v = w.steer;
      w.x += w.v * dt; w.rot += w.v * dt / RW;
      if (w.x > sg.b || w.x < sg.a) { w.mode = 'air'; w.vx = w.v; w.vy = 0; w.plat = null; }

    } else if (w.mode === 'path') {
      // along the girders: gravity along the way it's heading speeds it up downhill, a little rolling drag
      const P = w.path.path, at = s => { let j = 1; while (j < P.length - 1 && P[j].s < s) j++; return j; };
      const i = at(w.s), a = P[i - 1], b = P[i], seg = Math.max(0.001, b.s - a.s);
      w.v = clamp(w.v + G * 0.7 * (b.y - a.y) / seg * dt - w.v * 0.15 * dt, 40, 190);
      w.s += w.v * dt; w.rot += w.v * dt / RW * (b.x >= a.x ? 1 : -1);
      const end = P[P.length - 1];
      if (w.s >= end.s) { w.mode = 'ground'; w.x = end.x; w.y = BASE - RW; w.v = Math.max(w.v, 60); w.gvy = null; return; }
      const j = at(w.s), c = P[j - 1], d = P[j], f = (w.s - c.s) / Math.max(0.001, d.s - c.s);
      w.x = c.x + (d.x - c.x) * f; w.y = c.y + (d.y - c.y) * f;

    } else if (w.mode === 'funnel') {
      // round and round, tighter and faster, down to the spout
      // (it comes in at the speed it rolled off the deck, so there's no lurch, and picks up more on the way)
      const p = w.fun, k = Math.min(1, (w.k += dt / FUNNEL_TIME)), r = p.R * (1 - k) + 1.5 * k;
      w.v = Math.min(200, Math.max(60, w.fv) + 70 * k);
      w.th += w.v / Math.max(r, 5) * dt;
      w.x = p.fx + Math.cos(w.th) * r; w.y = funnelY(p, k) - RW + Math.sin(w.th) * r * 0.3;
      w.rot += w.v * dt / RW;
      if (k >= 1) { w.mode = 'ground'; w.x = Math.max(w.x, p.fx + 1); w.y = BASE - RW; w.gvy = null; }

    } else { // loop
      const p = w.loop, rr = p.R - RW;
      const h = rr * (1 - Math.cos(w.th)), v2 = w.v0 * w.v0 - 2 * G * h;
      // too slow to stay on at the top: the ghost marks the loop as needing a stronger pad; anything else
      // is helped round so it never drops out
      if (v2 < G * rr * 1.3 && w.ghost) { w.stalled = true; return; }
      const v = Math.sqrt(Math.max(v2, G * rr * 1.3));
      w.v = v; w.th += v / rr * dt; w.rot += v * dt / RW;
      if (w.th >= Math.PI * 2) {
        w.mode = 'ground'; w.x = p.ex + p.off; w.y = BASE - RW; w.v = w.v0; w.gvy = null; return;
      }
      const cx = p.ex + p.off * w.th / (Math.PI * 2);
      w.x = cx + Math.sin(w.th) * rr;
      w.y = BASE - p.R + Math.cos(w.th) * rr;
    }
  }

  function knock(p, t) {
    t.down = simT;
    emit(t.x + 1, BASE - 4, 6, [t.c, '#fff'], 40, 40, 160);
    if (p.ts.every(q => q.down)) popup(p.ts[1].x + 1, BASE - 12, 'BONUS', '#ffe600');
    else popup(t.x + 1, BASE - 10, '+50', t.c);
  }

  // Dice and chip stacks. The spring before each one throws wheels over it. A chat wheel on its way in or
  // out sometimes misses the spring (see spring()) and blows up on the die. If anything else ever touches
  // one (the ghost can't: a piece it hits isn't kept), it's nudged over, so the streamer's wheel and chat
  // wheels that are talking never crash.
  // (likelier on the way out, where it's the end of its visit anyway, than on the way in, where it holds up the message)
  const CRASH = CFG.crashes ? { in: 0.25, out: 0.6 } : { in: 0, out: 0 };
  function hazards(w, x0) {
    for (const p of pieces) {
      if (p.type !== 'hazard' || p.x1 < x0 - 20 || p.x0 > w.x + 20) continue;
      if (w.hopped === p || Math.abs(w.x - p.hx) >= p.hw / 2 + RW - 1 || w.y + RW <= BASE - p.hh) continue;
      if (w.ghost) { w.crashed = true; return; }
      if (w.doomed === p && w.phase !== 'talk') { explode(w); return; }
      w.doomed = null;
      hopOver(w, p); return;
    }
  }
  function hopOver(w, p) {
    w.hopped = p; w.mode = 'air'; w.vx = Math.max(w.v, 45); w.vy = -Math.sqrt(2 * G * (p.hh + 5)); w.gvy = null;
    emit(w.x, w.y + RW, 4, ['#e8d9b0', '#fff'], 20, 20, 150);
  }

  // Sparks in the wheel's color, smoke, a shock ring and a BOOM. On its way out that's the end of it; on its
  // way in it gets back on the track from the left a moment later, so its message still gets said.
  function explode(r) {
    const c = r.pal.main;
    emit(r.x, r.y, 30, [c, c, '#ffde59', '#ff8a00', '#fff'], 95, 130, 260, [0.4, 1.1]);
    emit(r.x, r.y, 10, ['#6a6488', '#4a4660', '#8a84a8'], 25, 25, -40, [0.6, 1.3]);
    rings.push({ x: r.x, y: r.y, r: 1, l: 0.35 });
    popup(r.x, r.y - 9, 'BOOM', '#ffde59');
    r.doomed = null;
    if (r.phase === 'out') removeRider(r);
    else r.deadUntil = performance.now() + 1400;
  }

  // ---------------- drawing ----------------
  function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); }

  // A chain lift: a dark channel down the middle of the track with the chain creeping up it, yellow
  // anti-rollback dogs clicking along beside it, and a motor housing with a turning gear at the foot.
  function drawBelt(g, a, b, v, cx, t) {
    for (let wx = Math.ceil(a); wx < b; wx++) {
      const sx = wx - cx; if (sx < -2 || sx > W + 2) continue;
      const y = Math.round(g(wx)), ph = (((wx - t * v) % 4) + 4) % 4;
      px(sx, y, ph < 2 ? '#e8e6f4' : '#3a2c40'); px(sx, y + 1, '#2a1c30');
      if ((((wx - Math.floor(t * v / 8) * 8) % 8) + 8) % 8 === 0) px(sx, y - 1, '#ffd84a');
      // the catwalk's handrail alongside, on posts
      px(sx, y - 5, '#a8a8c0');
      if (wx % 6 === 0) { ctx.fillStyle = '#7a7a90'; ctx.fillRect(sx, y - 4, 1, 4); }
    }
    const fx = Math.round(a) - cx, fy = Math.round(g(a)) + 4, an = t * v / 6;
    ctx.fillStyle = '#3a3450'; ctx.fillRect(fx - 3, fy, 7, 4); ctx.fillStyle = '#5a5470'; ctx.fillRect(fx - 3, fy, 7, 1);
    px(fx, fy + 2, '#ffd84a');
    for (let k = 0; k < 4; k++) px(fx + Math.round(Math.cos(an + k * Math.PI / 2) * 1.5), fy + 2 + Math.round(Math.sin(an + k * Math.PI / 2) * 1.5), '#c9c8d8');
  }
  function drawBelts(cx, t) {
    for (const p of pieces) {
      if (p.x1 < cx - 10 || p.x0 > cx + W + 10) continue;
      if (p.type === 'lift') drawBelt(p.g, p.x0, p.x1, p.chain, cx, t);
      if (p.belts) for (const bt of p.belts) drawBelt(bt.lane == null ? p.g : p.lanes[bt.lane], bt.a, bt.b, bt.v, cx, t);
    }
  }

  function drawTrack(cx, t) {
    for (let sx = 0; sx < W; sx++) {
      const wx = cx + sx, p = pieceAt(wx);
      const gy = p ? p.g(wx) : BASE;
      if (gy == null) continue;
      const y = Math.round(gy);
      // scaffold under raised track (dithered) + posts
      for (let yy = y + 4; yy < BASE + 4; yy++) if (((wx + yy) & 1) === 0) px(sx, yy, C.lattice);
      if ((((wx % 16) + 16) % 16) === 0) { ctx.fillStyle = C.post; ctx.fillRect(sx, y + 4, 1, H - y - 4); }
      let top = C.top;
      if (p && (p.type === 'ramp' || p.type === 'land')) top = (Math.floor(wx / 3) & 1) ? C.stripeA : C.stripeB;
      px(sx, y, top); px(sx, y + 1, C.body); px(sx, y + 2, C.dark); px(sx, y + 3, C.shade);
    }

    for (const p of pieces) {
      if (p.x1 < cx - 60 || p.x0 > cx + W + 60) continue;
      if (p.type === 'boost') {
        for (let wx = p.pa; wx < p.pb; wx++) for (let row = 0; row < 2; row++) {
          const ph = (((wx - row - t * 70) % 6) + 6) % 6;
          px(wx - cx, BASE + row, ph < 3 ? C.boostA : C.boostB);
        }
        if (((t * 6) | 0) & 1) for (let wx = p.pa; wx < p.pb; wx += 3) px(wx - cx, BASE - 1, 'rgba(63,248,255,0.5)');
      } else if (p.type === 'spring') {
        const e = Math.round(p.spring * 6), w = p.pb - p.pa, sx = p.pa - cx;
        ctx.fillStyle = C.padDark; ctx.fillRect(sx, BASE - 1, w, 1);
        for (let i = 0; i < e; i++) px(sx + 2 + (i & 1) * (w - 5), BASE - 2 - i, C.coil);
        ctx.fillStyle = C.pad; ctx.fillRect(sx, BASE - 3 - e, w, 1);
        ctx.fillStyle = C.padDark; ctx.fillRect(sx, BASE - 2 - e, w, 1);
      } else if (p.type === 'arch') drawArch(p, cx, t, 'back');
      else if (p.lanes && p.frontLane == null) drawLane(p, cx, p.lanes[1], false);   // a split's upper deck
      else if (p.type === 'dominoes') {
        // each tips over a moment after the one before, coming to rest leaning on the next; the last lies flat
        const n = p.ds.length;
        p.ds.forEach((dx0, i) => {
          const f = p.start < 0 ? 0 : clamp((simT - p.start - i * 0.06) / 0.12, 0, 1);
          const a = f * (i === n - 1 ? 1.5 : 0.95), ca = Math.cos(a), sa = Math.sin(a), sx = dx0 - cx;
          for (let s = 0; s < 7; s++) {
            const xx = Math.round(sx + sa * s), yy = Math.round(BASE - 1 - ca * s);
            px(xx, yy, s === 1 || s === 3 || s === 5 ? '#1f1830' : '#fffaf0');
            px(xx + 1, yy, '#bdb6d0');
          }
        });
      } else if (p.type === 'loop') {
        if (p.roulette) drawRoulette(p.ex - cx, BASE - p.R, Math.max(4, p.R - 2 * RW - 1), t);
        const cols = [C.top, C.body, C.dark, C.shade];
        const steps = Math.ceil(2 * Math.PI * (p.R + 3) * 1.6);
        for (let k = 3; k >= 0; k--) {
          const rr = p.R + k;
          for (let i = 0; i <= steps; i++) {
            const th = i / steps * Math.PI * 2;
            const ccx = p.ex + p.off * th / (Math.PI * 2);
            let c = cols[k];
            // a roulette wheel: gold rims round a slowly turning ring of red and black, with one green zero
            if (p.roulette) {
              const seg = Math.floor((((th + t * 0.5) / (2 * Math.PI)) % 1) * 18);
              c = k === 0 || k === 3 ? (k ? '#b8862a' : '#ffd84a') : seg === 0 ? '#1fae5b' : seg & 1 ? '#2a2236' : '#e8344e';
            }
            px(Math.round(ccx + Math.sin(th) * rr) - cx, Math.round(BASE - p.R + Math.cos(th) * rr), c);
          }
        }
      } else if (p.type === 'kicker') {
        // a pinball slingshot: a triangle of rubber on a post, leaning the way it kicks, lit when it fires
        const kx = p.kx - cx, lit = p.lit > 0, back = p.dir === 'back', steep = p.dir === 'up';
        const tip = back ? [kx - 4, BASE - 9] : steep ? [kx, BASE - 11] : [kx + 5, BASE - 6];
        for (let i = 0; i <= 10; i++) {
          const t = i / 10;
          for (const [ax, ay] of [[kx - 4, BASE - 1], [kx + 4, BASE - 1]]) px(Math.round(ax + (tip[0] - ax) * t), Math.round(ay + (tip[1] - ay) * t), lit ? '#ffe600' : '#ff3b5c');
        }
        ctx.fillStyle = lit ? '#fff3a8' : '#2a2236'; ctx.fillRect(kx - 3, BASE - 3, 7, 2);
        ctx.fillStyle = '#c9c8d8'; ctx.fillRect(kx - 4, BASE - 1, 9, 1);
        px(tip[0], tip[1], '#3ff8ff');
      } else if (p.type === 'pinfield') {
        // the bumpers floating over the track
        for (const b of p.bs) {
          const bx = Math.round(b.x - cx), by = Math.round(b.y), lit = b.lit > 0;
          for (let dy = -b.r - 1; dy <= b.r + 1; dy++) for (let dx = -b.r - 1; dx <= b.r + 1; dx++) {
            const d = Math.hypot(dx, dy);
            if (d > b.r + 0.6) continue;
            px(bx + dx, by + dy, d > b.r - 0.8 ? (lit ? '#ffe600' : '#3ff8ff') : d > b.r - 2 ? '#fffaf0' : lit ? '#fff' : '#ff3bd0');
          }
          if (lit) for (let k = 0; k < 8; k++) { const a = k / 8 * 6.283; px(Math.round(bx + Math.cos(a) * (b.r + 2)), Math.round(by + Math.sin(a) * (b.r + 2)), '#fff3a8'); }
        }
      } else if (p.type === 'cones') {
        for (const c of p.cs) if (!c.hit) drawCone(c.x - cx, BASE - 1, 0);
      } else if (p.type === 'hazard') {
        const x = p.hx - Math.floor(p.hw / 2) - cx;
        if (p.kind === 'die') drawDie(x, BASE - 7, p.face);
        else {
          // poker chips side-on: each a short cylinder lit from the front left, darker round the sides, with
          // white inlays in its edge, and the top chip's face catching the light
          const SH = [-0.5, -0.15, 0.12, 0.28, 0.22, 0.05, -0.2, -0.5];
          p.cols.forEach(([main], i) => {
            const y = BASE - 2 - 2 * i;
            for (let j = 0; j < p.hw; j++) {
              const inlay = j === 2 || j === 5;
              px(x + j, y, shade(inlay ? '#f4f0ff' : main, SH[j]));
              px(x + j, y + 1, shade(inlay ? '#cfc8e0' : main, SH[j] - 0.25));
            }
          });
          const face = p.cols[p.n - 1][0];
          for (let j = 1; j < p.hw - 1; j++) px(x + j, BASE - 1 - 2 * p.n, shade(face, j === 1 || j === p.hw - 2 ? 0.15 : 0.4));
        }
      } else if (p.type === 'bumper') {
        // a mushroom cap: red rim, white band, red top; flashes yellow when hit
        const lit = p.lit > 0, bx = p.bx - cx, by = BASE - 5;
        for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
          const d = Math.hypot(dx, dy);
          if (d > 4.4) continue;
          px(bx + dx, by + dy, d > 3.2 ? (lit ? '#ffe600' : '#ff3b5c') : d > 2 ? '#fffaf0' : lit ? '#fff' : '#ff3b5c');
        }
        ctx.fillStyle = '#4a4660'; ctx.fillRect(bx - 2, BASE - 1, 5, 1);
      } else if (p.type === 'targets') {
        for (const q of p.ts) {
          ctx.fillStyle = q.c;
          if (q.down) ctx.fillRect(q.x - cx - 1, BASE - 1, 4, 1);
          else { ctx.fillRect(q.x - cx, BASE - 6, 2, 6); px(q.x - cx, BASE - 6, '#fff'); }
        }
      } else if (p.type === 'flipper') {
        // a paddle hinged on the track's edge, sticking out over the gap nearly level with the track (just a
        // little droop) until it swats up
        const a = 0.22 - p.up * 0.85, fx = p.fx - cx, fy = BASE + 1;
        for (let s = 0; s <= 13; s++) {
          const x = Math.round(fx + Math.cos(a) * s), y = Math.round(fy + Math.sin(a) * s), th = Math.round(4 - 2 * s / 13);
          ctx.fillStyle = '#ff3b5c'; ctx.fillRect(x, y - (th >> 1), 1, th);
          px(x, y - (th >> 1), '#ffb3c1');
        }
        ctx.fillStyle = '#e9e6ff'; ctx.fillRect(fx - 1, fy - 1, 3, 3); px(fx, fy, '#6a6488');
      }
    }
  }

  // The second lane of a two-lane piece: a strip of track like the main one, drawn the whole way, so it
  // peels smoothly off the main track at the fork and runs back into it where they join. Raised lanes stand
  // on lattice and posts down to the lower lane where there's room under them, except a split's level deck,
  // which hangs from a suspension bridge, and the part of a girder deck over its girders. A braid's front
  // lane is drawn in front of the wheels, with only short brackets so it doesn't hide the lane behind it.
  function drawLane(p, cx, g, front) {
    if (!front && p.type === 'split') drawSuspension(p, cx);   // (behind its deck)
    const hung = x => p.type === 'split' && x > p.x0 + p.ramp && x < p.x1 - p.ramp, over = x => p.tiers && x >= p.xe - (p.xe - p.xs) && x <= p.xe;
    for (let wx = Math.max(Math.ceil(p.x0), cx); wx < Math.min(p.x1, cx + W); wx++) {
      const sx = wx - cx, y = Math.round(g(wx)), low = Math.round(p.lanes[0](wx));
      if (!front && low - y > 5 && !hung(wx) && !over(wx)) {
        for (let yy = y + 4; yy < low; yy++) if (((wx + yy) & 1) === 0) px(sx, yy, C.lattice);
        if ((((wx % 16) + 16) % 16) === 0) { ctx.fillStyle = C.post; ctx.fillRect(sx, y + 4, 1, low - y - 4); }
      } else if (front && Math.abs(low - y) > 6 && (((wx % 20) + 20) % 20) === 0) { ctx.fillStyle = C.post; ctx.fillRect(sx, y + 4, 1, 3); }
      px(sx, y, C.top); px(sx, y + 1, C.body); px(sx, y + 2, C.dark); px(sx, y + 3, C.shade);
    }
    if (front) return;
    if (p.tiers) drawGirders(p, cx);
    if (p.type === 'funnel') drawFunnel(p, cx, 'back');
  }

  // A suspension bridge for a split's upper deck: a tower standing on the ground where each end of the
  // level deck begins, the main cable sagging between their tops with a hanger down to the deck every few
  // pixels, and a backstay from each top down to a concrete anchor block on the ground outside it.
  function drawSuspension(p, cx) {
    const top = BASE - p.A, th = 14, xa = Math.round(p.x0 + p.ramp), xb = Math.round(p.x1 - p.ramp), ct = top - th + 1;
    const line = (x0, y0, x1, y1, c) => {
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
      for (let i = 0; i <= n; i++) px(Math.round(x0 + (x1 - x0) * i / n - cx), Math.round(y0 + (y1 - y0) * i / n), c);
    };
    for (const [tx, out] of [[xa, -1], [xb, 1]]) {
      const ax = tx + out * 16;
      line(tx, ct, ax, BASE - 4, '#e8e8f4');   // backstay
      ctx.fillStyle = '#6a6478'; ctx.fillRect(ax - 3 - cx, BASE - 4, 7, 4); ctx.fillStyle = '#8a8498'; ctx.fillRect(ax - 3 - cx, BASE - 4, 7, 1);
      const x = tx - cx;
      ctx.fillStyle = '#c9c8d8'; ctx.fillRect(x - 2, top - th, 1, BASE - top + th); ctx.fillRect(x + 2, top - th, 1, BASE - top + th);
      ctx.fillStyle = '#8a8aa0'; ctx.fillRect(x - 2, top - th, 5, 1); ctx.fillRect(x - 1, top - th + 5, 3, 1); ctx.fillRect(x - 1, top + 6, 3, 1);
      ctx.fillStyle = '#5a5470'; ctx.fillRect(x - 3, BASE - 1, 7, 1);   // footing
      px(x, top - th - 1, '#ff3b5c');   // aircraft light
    }
    for (let wx = xa + 1; wx < xb; wx++) {
      const u = (wx - xa) / (xb - xa), cy = Math.round(ct + (th - 4) * 4 * u * (1 - u)), sx = wx - cx;
      if (sx < -1 || sx > W) continue;
      px(sx, cy, '#e8e8f4');
      if ((wx - xa) % 4 === 0) { ctx.fillStyle = '#9a9ab4'; ctx.fillRect(sx, cy + 1, 1, top - cy - 1); }
    }
  }

  // Donkey Kong girders: red I-beams riveted along their tops with criss-cross webs, cyan ladders between
  // them, an iron column at each end of the stack holding them up, a banked steel guard round the outside
  // of each hairpin, and a last curved beam down to the track.
  function drawGirders(p, cx) {
    const xl = p.tiers[0].xa, xr = p.xe;
    for (const x of [xl - 2, xr + 1]) { ctx.fillStyle = '#7a2c3a'; ctx.fillRect(Math.round(x - cx), p.top + 4, 2, BASE - p.top - 4); }
    for (const [lx, t] of [[xl + 10, 0], [xr - 12, 1]]) {   // ladders from each girder up to the one above
      const a = p.tiers[t], yTop = t === 0 ? p.top + 3 : p.tiers[0].ya + 3, yBot = Math.round(a.ya + (a.yb - a.ya) * (lx - a.xa) / (a.xb - a.xa));
      for (let y = yTop; y < yBot; y++) { px(lx - cx, y, '#3ff8ff'); px(lx + 3 - cx, y, '#3ff8ff'); if (y % 2 === 0) { px(lx + 1 - cx, y, '#3ff8ff'); px(lx + 2 - cx, y, '#3ff8ff'); } }
    }
    const beam = (sx, y, x) => {
